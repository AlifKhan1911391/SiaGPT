<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiaGPT — Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --surface2:  #161616;
      --border:    #1e1e1e;
      --border2:   #2a2a2a;
      --rose:      #e8607a;
      --rose-dim:  rgba(232,96,122,0.12);
      --text:      #e8e0dc;
      --muted:     #6a6060;
      --muted2:    #888080;
      --user-bg:   #1f1416;
      --ai-bg:     #141414;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,10,0.95);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .back-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      color: var(--muted2);
      transition: all .2s;
      flex-shrink: 0;
    }
    .back-btn:hover { border-color: var(--rose); color: var(--rose); }

    .gf-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1px solid rgba(232,96,122,0.35);
    }
    .gf-info { flex: 1; min-width: 0; }
    .gf-info .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gf-info .status {
      font-size: .7rem;
      color: var(--muted);
      display: flex; align-items: center; gap: 5px;
      margin-top: 1px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #3dba6f;
      display: inline-block;
      animation: pulse 2.5s infinite;
    }
    .logo-tag {
      font-family: 'Cormorant Garamond', serif;
      font-size: .8rem;
      font-style: italic;
      color: var(--rose);
      opacity: 0.6;
      flex-shrink: 0;
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    .date-divider {
      text-align: center;
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      position: relative;
      margin: 6px 0;
    }
    .date-divider::before, .date-divider::after {
      content: '';
      position: absolute;
      top: 50%; width: 28%;
      height: 1px; background: var(--border);
    }
    .date-divider::before { left: 0; }
    .date-divider::after  { right: 0; }

    /* Message rows — NO user avatar */
    .msg-row {
      display: flex;
      gap: 10px;
      animation: msgIn .25s ease both;
    }
    .msg-row.user { flex-direction: row-reverse; }

    /* AI avatar only */
    .msg-row .ai-av {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      align-self: flex-end;
      border: 1px solid var(--border2);
    }
    /* spacer for user side — no avatar */
    .msg-row.user .av-spacer { display: none; }

    .bubble-wrap { display: flex; flex-direction: column; max-width: 74%; }
    .msg-row.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: .9rem;
      line-height: 1.58;
      word-break: break-word;
    }
    .msg-row.ai .bubble {
      background: var(--ai-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }
    .msg-row.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(232,96,122,0.2);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }
    .msg-time {
      font-size: .65rem;
      color: var(--muted);
      margin-top: 4px;
      padding: 0 3px;
    }

    /* Typing indicator */
    .typing-bubble {
      display: none;
      padding: 12px 16px;
      gap: 5px;
      align-items: center;
    }
    .typing-bubble.visible { display: flex; }
    .typing-bubble span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }
    .typing-bubble span:nth-child(2) { animation-delay: .2s; }
    .typing-bubble span:nth-child(3) { animation-delay: .4s; }

    /* ── Input bar ── */
    .input-bar {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,10,0.96);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: flex-end;
      gap: 10px;
      position: sticky;
      bottom: 0;
      z-index: 10;
    }
    .input-wrap {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      padding: 9px 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: rgba(232,96,122,0.4);
      box-shadow: 0 0 0 3px var(--rose-dim);
    }
    textarea#msgInput {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      color: var(--text);
      background: transparent;
      max-height: 120px;
      line-height: 1.5;
    }
    textarea#msgInput::placeholder { color: var(--muted); }
    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--rose);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 16px rgba(232,96,122,0.3);
      transition: background .2s, transform .15s;
    }
    .send-btn:hover { background: #cf4f68; transform: scale(1.05); }
    .send-btn:active { transform: scale(.96); }
    .send-btn svg { width: 17px; height: 17px; fill: #fff; }

    /* ── API key missing notice ── */
    .api-missing {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      text-align: center;
      padding: 40px 20px;
    }
    .api-missing .icon { font-size: 2rem; }
    .api-missing p { color: var(--muted2); font-size: .88rem; max-width: 260px; line-height: 1.6; }
    .api-missing a {
      color: var(--rose);
      text-decoration: none;
      font-size: .85rem;
      border-bottom: 1px solid rgba(232,96,122,0.3);
    }

    /* ── Animations ── */
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-5px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    @media (max-width: 500px) {
      .bubble-wrap { max-width: 88%; }
      .logo-tag { display: none; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Top bar -->
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'" title="Back">←</button>
    <img id="topAvatar" class="gf-avatar" src="avatar.png" alt="Avatar"
         onerror="this.src='https://api.dicebear.com/8.x/adventurer/svg?seed=Sia&backgroundColor=1a1a1a'" />
    <div class="gf-info">
      <div class="name" id="topGfName">Sia</div>
      <div class="status"><span class="dot"></span> Online now</div>
    </div>
    <div class="logo-tag">SiaGPT</div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="date-divider">Today</div>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Say something sweet…" rows="1"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
// Load user data
const userName = localStorage.getItem('siagpt_user')   || 'User';
const gfName   = localStorage.getItem('siagpt_gf')     || 'Sia';
const avatar   = localStorage.getItem('siagpt_avatar') || 'avatar.png';
const apiKey   = localStorage.getItem('siagpt_apikey') || '';

// If no API key, redirect back
if (!apiKey) {
  alert('Please enter your OpenRouter API key first.');
  window.location.href = 'index.html';
}

document.getElementById('topGfName').textContent = gfName;
document.title = `SiaGPT — ${gfName}`;
const topAv = document.getElementById('topAvatar');
topAv.src = avatar;
topAv.onerror = () => {
  topAv.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`;
};

// Conversation state
let history = [];
const messagesEl = document.getElementById('messages');

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function appendMessage(role, text) {
  const isUser = role === 'user';
  const row = document.createElement('div');
  row.className = `msg-row ${isUser ? 'user' : 'ai'}`;

  // AI avatar only — user has no avatar
  if (!isUser) {
    const av = document.createElement('img');
    av.className = 'ai-av';
    av.src = avatar;
    av.alt = gfName;
    av.onerror = () => {
      av.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`;
    };
    row.appendChild(av);
  }

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = timeStr();

  wrap.appendChild(bubble);
  wrap.appendChild(time);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  if (document.getElementById('typingRow')) return;
  const row = document.createElement('div');
  row.id = 'typingRow';
  row.className = 'msg-row ai';

  const av = document.createElement('img');
  av.className = 'ai-av';
  av.src = avatar;
  av.onerror = () => {
    av.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`;
  };

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing-bubble visible';
  bubble.innerHTML = '<span></span><span></span><span></span>';

  wrap.appendChild(bubble);
  row.appendChild(av);
  row.appendChild(wrap);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const row = document.getElementById('typingRow');
  if (row) row.remove();
}

// Call via Netlify function — passes user's own apiKey in the body
async function callOpenRouter(messages, greet = false) {
  const res = await fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages, userName, gfName, greet, apiKey })
  });

  const data = await res.json();
  if (!res.ok) throw new Error(data?.reply || 'Server error');
  return data.reply || `Hey ${userName}! 💖`;
}

// Send message
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  appendMessage('user', text);
  history.push({ role: 'user', content: text });

  showTyping();
  try {
    const reply = await callOpenRouter(history);
    hideTyping();
    appendMessage('ai', reply);
    history.push({ role: 'assistant', content: reply });
    if (history.length > 40) history = history.slice(-38);
  } catch (err) {
    hideTyping();
    const msg = err.message?.includes('key') || err.message?.includes('auth')
      ? 'Invalid API key 💔 Please go back and re-enter it.'
      : 'Ami tomar sathe connect korte parcchi na 💔 Try again?';
    appendMessage('ai', msg);
  }
}

// Auto-resize textarea
const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Greeting
async function greet() {
  showTyping();
  try {
    const reply = await callOpenRouter([], true);
    hideTyping();
    appendMessage('ai', reply);
    history.push({ role: 'assistant', content: reply });
  } catch {
    hideTyping();
    appendMessage('ai', `Hey ${userName}! 😘 Ami ${gfName} - tomar AI gf. Kemon acho? 💖`);
  }
}

greet();
</script>
</body>
</html>
