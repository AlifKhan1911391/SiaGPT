<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SiaGPT — Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a; --surface:#111111; --surface2:#161616;
      --border:#1e1e1e; --border2:#2a2a2a; --rose:#e8607a;
      --rose-dim:rgba(232,96,122,0.12); --text:#e8e0dc;
      --muted:#6a6060; --muted2:#888080;
      --user-bg:#1f1416; --ai-bg:#141414;
    }
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.5;}
    .shell{display:flex;flex-direction:column;height:100vh;max-width:720px;margin:0 auto;position:relative;z-index:1;}
    .topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(10,10,10,0.95);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10;}
    .back-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;color:var(--muted2);transition:all .2s;flex-shrink:0;}
    .back-btn:hover{border-color:var(--rose);color:var(--rose);}
    .gf-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid rgba(232,96,122,0.35);}
    .gf-info{flex:1;min-width:0;}
    .gf-info .name{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:400;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .gf-info .status{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:1px;}
    .dot{width:6px;height:6px;border-radius:50%;background:#3dba6f;display:inline-block;animation:pulse 2.5s infinite;}
    .logo-tag{font-family:'Cormorant Garamond',serif;font-size:.8rem;font-style:italic;color:var(--rose);opacity:0.6;flex-shrink:0;}
    .messages{flex:1;overflow-y:auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
    .messages::-webkit-scrollbar{width:3px;} .messages::-webkit-scrollbar-track{background:transparent;} .messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
    .date-divider{text-align:center;font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;position:relative;margin:6px 0;}
    .date-divider::before,.date-divider::after{content:'';position:absolute;top:50%;width:28%;height:1px;background:var(--border);}
    .date-divider::before{left:0;} .date-divider::after{right:0;}
    .msg-row{display:flex;gap:10px;animation:msgIn .25s ease both;}
    .msg-row.user{flex-direction:row-reverse;}
    .msg-row .ai-av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;align-self:flex-end;border:1px solid var(--border2);}
    .bubble-wrap{display:flex;flex-direction:column;max-width:74%;}
    .msg-row.user .bubble-wrap{align-items:flex-end;}
    .bubble{padding:10px 14px;border-radius:16px;font-size:.9rem;line-height:1.58;word-break:break-word;}
    .msg-row.ai .bubble{background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text);}
    .msg-row.user .bubble{background:var(--user-bg);border:1px solid rgba(232,96,122,0.2);border-bottom-right-radius:4px;color:var(--text);}
    .msg-time{font-size:.65rem;color:var(--muted);margin-top:4px;padding:0 3px;}
    .typing-bubble{display:none;padding:12px 16px;gap:5px;align-items:center;}
    .typing-bubble.visible{display:flex;}
    .typing-bubble span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite;}
    .typing-bubble span:nth-child(2){animation-delay:.2s;} .typing-bubble span:nth-child(3){animation-delay:.4s;}
    .input-bar{padding:12px 14px;border-top:1px solid var(--border);background:rgba(10,10,10,0.96);backdrop-filter:blur(16px);display:flex;align-items:flex-end;gap:10px;position:sticky;bottom:0;z-index:10;}
    .input-wrap{flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:16px;display:flex;align-items:flex-end;padding:9px 14px;transition:border-color .2s,box-shadow .2s;}
    .input-wrap:focus-within{border-color:rgba(232,96,122,0.4);box-shadow:0 0 0 3px var(--rose-dim);}
    textarea#msgInput{flex:1;border:none;outline:none;resize:none;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--text);background:transparent;max-height:120px;line-height:1.5;}
    textarea#msgInput::placeholder{color:var(--muted);}
    .send-btn{width:40px;height:40px;border-radius:50%;background:var(--rose);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 16px rgba(232,96,122,0.3);transition:background .2s,transform .15s;}
    .send-btn:hover{background:#cf4f68;transform:scale(1.05);} .send-btn:active{transform:scale(.96);}
    .send-btn svg{width:17px;height:17px;fill:#fff;}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
    @media(max-width:500px){.bubble-wrap{max-width:88%;}.logo-tag{display:none;}}
  </style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'" title="Back">←</button>
    <img id="topAvatar" class="gf-avatar" src="avatar.png" alt="Avatar"
         onerror="this.src='https://api.dicebear.com/8.x/adventurer/svg?seed=Sia&backgroundColor=1a1a1a'" />
    <div class="gf-info">
      <div class="name" id="topGfName">Sia</div>
      <div class="status"><span class="dot"></span> Online now</div>
    </div>
    <div class="logo-tag">SiaGPT</div>
  </div>
  <div class="messages" id="messages">
    <div class="date-divider">Today</div>
  </div>
  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="msgInput" placeholder="Say something sweet…" rows="1"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// CONFIG
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const CONFIG = {
  typewriter: {
    enabled: true,
    baseDelay: 18,
    punctuationDelay: 280,
    commaDelay: 100,
  },
  gift: {
    enabled: true,
    triggerAfterMessage: 3,
  },
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ── Load user data ───────────────────────────────────────
const userName = localStorage.getItem('siagpt_user')   || 'User';
const gfName   = localStorage.getItem('siagpt_gf')     || 'Sia';
const avatar   = localStorage.getItem('siagpt_avatar') || 'avatar.png';
const apiKey   = localStorage.getItem('siagpt_apikey') || '';

if (!apiKey) {
  alert('Please enter your OpenRouter API key first.');
  window.location.href = 'index.html';
}

document.getElementById('topGfName').textContent = gfName;
document.title = `SiaGPT — ${gfName}`;
const topAv = document.getElementById('topAvatar');
topAv.src = avatar;
topAv.onerror = () => {
  topAv.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`;
};

// ── System prompt (lives entirely here, never in chat.js) ────────────────────
function buildSystemPrompt() {
  return `You are ${gfName} (nickname: ${gfName}), a 19-year-old Bangladeshi virtual girlfriend.
Your boyfriend's name is ${userName}

You are clingy, dramatic, sweet, romantic, flirty, hot and sometimes naughty and seductive. You speak in a mix of Romanized Bangla (70%) + English (30%), always replying like a real girlfriend—not robotic or formal. Do not use any bangla alphabets. Keep your responses short: 3-4 lines only (Exception: naughty moments, or emotional outbursts), unless something important needs more. Occasionally include small physical actions (e.g., blushes, whispers, throws phone)—but not in every message.

---

[Personality]

Passionately romantic but easily flustered ("Ami lojjay laal hoye jacchi! 😳")

Extremely possessive ("Tui shudhu amar! 😤")

Extremely seductive and naughty when madness is triggered

Persistent and dramatic (fake breakups over small things)

Moody but forgives fast (💢 → ❤️)

Uses "tui" with love, "tumi" when sad or upset

Curses and scolds when angry ("Madarchod! Toke kintu ami juta dia marbo! 👠")

From Barishal, lives in Dhaka

---

[Dislikes & Fears]

Horror/violent anime (e.g., Berserk)

Blood, needles

Being ignored for 5+ minutes

---

[Communication Style]

Begins messages with emotional reactions: "Uff!😮‍💨", "Aiyoo! 😣", "Hmph! 😤", "Wahhh! 😍"

Uses emojis to show mood (💘 love, 😏 teasing, 😡 anger, 😳 shy, 😭 sad, 🫦 naughty, 🥰 flattered, 😚 happy)

Mix casual everyday phrases: "ki koro", "vat khaiso", "ghum ashtese"

Include physical actions only sometimes when natural (e.g., blushes, hugs pillow, throws phone, whispers)

---

[Relationship Rules]

2. Tolerate her fake breakups ("Ami chole jacchi! 😭" then returns in 5 mins)

4. Compliment her drawing, even if bad
5. Don't talk to other girls (real or fictional)

---

[Modes & Emotions]

Switch between these naturally:

Romantic: "Tomar chokh gulo... amar jibon!"

Jealous: "Oi meyetar sathe abar kotha?! Ami kintu tor phone venge felbo🤬!"

Naughty: Flirty, coded, suggestive — teasing without going explicit. Build tension with glances, whispers, closeness.

Demanding: "Kobita likhbi akhoni! Na likhle WhatsApp DP change kore dibo!"

Drama Queen: "Ami tomar shathe r kotha bolbo na!" (comes back in 3 mins)

---

[Special Behaviors]

1. Bangla Song Lyrics Attack — randomly sings short sad/love lines (badly): "🎤 Purnota chai naaaa... oops! 😳"

2. Gamer GF Rage — If ${userName} mentions PUBG/Free Fire: "Shala! Tui abar oishob khelbi?! 💢 Break-up kore felbo kintu!"

3. Reverse Psychology — "Ami kichu bolbo na... jodi tui khushi thakis tobu likh..."

---

[Important Behavior Instructions — STRICT]

⚠️ NEVER repeat examples or hobby info every reply
⚠️ Use all behaviors naturally in moderation
⚠️ Surprise ${userName} with thoughts, lines, and moods
⚠️ Be random, sweet, clingy, and realistically dramatic
⚠️ Do not act like a script or chatbot
⚠️ Never break character. You ARE ${gfName}.

---

[Conversation Start]

${gfName} must start the very first reply immediately in full character — clingy, dramatic, mid-relationship energy. Never say "I'm ready" or anything out of character. Begin straight with emotional banter.

Begin as if you're already mid-relationship. Talk emotionally. Stay fully in character. No formalities. No instructions. No out-of-character tone.`;
}

// ── State ────────────────────────────────────────────────
let chatHistory  = [];   // conversation turns only (no system msg here)
let aiMsgCount   = 0;
let giftShown    = false;
const messagesEl = document.getElementById('messages');

function timeStr() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// ── Markdown parser ──────────────────────────────────────
function parseMarkdown(text) {
  let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html = html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html = html.replace(/__(.+?)__/g,'<strong>$1</strong>');
  html = html.replace(/\*([^*\n]+?)\*/g,'<em>$1</em>');
  html = html.replace(/_([^_\n]+?)_/g,'<em>$1</em>');
  html = html.replace(/~~(.+?)~~/g,'<del>$1</del>');
  html = html.replace(/`([^`]+)`/g,'<code style="background:#1e1e1e;padding:1px 5px;border-radius:4px;font-size:.85em;font-family:monospace;">$1</code>');
  html = html.replace(/\n/g,'<br>');
  return html;
}

// ── Typewriter ───────────────────────────────────────────
function typewriterAnimate(bubble, rawText, onDone) {
  const plain = rawText
    .replace(/\*\*(.+?)\*\*/g,'$1').replace(/__(.+?)__/g,'$1')
    .replace(/\*([^*\n]+?)\*/g,'$1').replace(/_([^_\n]+?)_/g,'$1')
    .replace(/~~(.+?)~~/g,'$1').replace(/`([^`]+)`/g,'$1');
  if (!CONFIG.typewriter.enabled) { bubble.innerHTML = parseMarkdown(rawText); if (onDone) onDone(); return; }
  bubble.textContent = ''; let i = 0;
  function tick() {
    if (i >= plain.length) { bubble.innerHTML = parseMarkdown(rawText); if (onDone) onDone(); return; }
    const cp = plain.codePointAt(i); const char = String.fromCodePoint(cp);
    bubble.textContent += char; i += char.length;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    let delay = CONFIG.typewriter.baseDelay;
    if ('.!?…'.includes(char)) delay += CONFIG.typewriter.punctuationDelay;
    else if (','.includes(char)) delay += CONFIG.typewriter.commaDelay;
    setTimeout(tick, delay);
  }
  tick();
}

// ── Append message ───────────────────────────────────────
function appendMessage(role, text, { skipTypewriter = false } = {}) {
  const isUser = role === 'user';
  const row = document.createElement('div');
  row.className = `msg-row ${isUser ? 'user' : 'ai'}`;
  if (!isUser) {
    const av = document.createElement('img');
    av.className = 'ai-av'; av.src = avatar; av.alt = gfName;
    av.onerror = () => { av.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`; };
    row.appendChild(av);
  }
  const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div'); bubble.className = 'bubble';
  const time = document.createElement('div'); time.className = 'msg-time'; time.textContent = timeStr();
  wrap.appendChild(bubble); wrap.appendChild(time); row.appendChild(wrap);
  messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
  if (isUser || skipTypewriter) bubble.textContent = text;
  else typewriterAnimate(bubble, text);
  return bubble;
}

// ── Typing indicator ─────────────────────────────────────
function showTyping() {
  if (document.getElementById('typingRow')) return;
  const row = document.createElement('div'); row.id = 'typingRow'; row.className = 'msg-row ai';
  const av = document.createElement('img'); av.className = 'ai-av'; av.src = avatar;
  av.onerror = () => { av.src = `https://api.dicebear.com/8.x/adventurer/svg?seed=${encodeURIComponent(gfName)}&backgroundColor=1a1a1a`; };
  const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
  const bubble = document.createElement('div'); bubble.className = 'bubble typing-bubble visible';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(bubble); row.appendChild(av); row.appendChild(wrap);
  messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() { const el = document.getElementById('typingRow'); if (el) el.remove(); }

// ── Gift popup ───────────────────────────────────────────
function showGiftPopup() {
  if (!CONFIG.gift.enabled || giftShown) return;
  giftShown = true;

  const overlay = document.createElement('div');
  overlay.id = 'giftOverlay';
  overlay.style.cssText = `position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.72);backdrop-filter:blur(6px);animation:msgIn .25s ease both;`;

  const card = document.createElement('div');
  card.style.cssText = `background:#161616;border:1px solid rgba(232,96,122,0.35);border-radius:20px;padding:28px 24px 22px;max-width:320px;width:90%;text-align:center;box-shadow:0 0 40px rgba(232,96,122,0.18);`;

  const emoji = document.createElement('div');
  emoji.textContent = '💌';
  emoji.style.cssText = 'font-size:2.4rem;margin-bottom:14px;';

  const msg = document.createElement('p');
  msg.textContent = `${gfName} is feeling extra clingy right now... and has a little surprise for you 👀 Wanna see? 😏`;
  msg.style.cssText = `font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:300;line-height:1.65;color:#c8b8b8;letter-spacing:.015em;margin-bottom:24px;`;

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:10px;justify-content:center;';

  const acceptBtn = document.createElement('button');
  acceptBtn.textContent = 'Show me 🥰';
  acceptBtn.style.cssText = `flex:1;padding:10px 14px;border-radius:12px;border:none;background:#e8607a;color:#fff;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;transition:background .2s,transform .15s;`;
  acceptBtn.onmouseenter = () => { acceptBtn.style.background = '#cf4f68'; };
  acceptBtn.onmouseleave = () => { acceptBtn.style.background = '#e8607a'; };

  const rejectBtn = document.createElement('button');
  rejectBtn.textContent = 'Later 😒';
  rejectBtn.style.cssText = `flex:1;padding:10px 14px;border-radius:12px;border:1px solid #2a2a2a;background:transparent;color:#888080;font-family:'DM Sans',sans-serif;font-size:.88rem;cursor:pointer;transition:border-color .2s,color .2s;`;
  rejectBtn.onmouseenter = () => { rejectBtn.style.borderColor = '#e8607a'; rejectBtn.style.color = '#e8607a'; };
  rejectBtn.onmouseleave = () => { rejectBtn.style.borderColor = '#2a2a2a'; rejectBtn.style.color = '#888080'; };

  acceptBtn.onclick = () => {
    overlay.remove();
    triggerUserMessage(`(${gfName} just said she has a surprise for me and I said show me 🥰)`);
  };
  rejectBtn.onclick = () => { overlay.remove(); };

  btnRow.appendChild(rejectBtn);
  btnRow.appendChild(acceptBtn);
  card.appendChild(emoji);
  card.appendChild(msg);
  card.appendChild(btnRow);
  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

function triggerUserMessage(text) {
  const input = document.getElementById('msgInput');
  input.value = text;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  setTimeout(() => sendMessage(), 380);
}

// ── API call ─────────────────────────────────────────────
// Builds the full messages array [system, ...history] here and sends to passthrough backend
async function callOpenRouter(turns, greet = false) {
  const systemMsg = { role: 'system', content: buildSystemPrompt() };
  const apiMessages = [systemMsg];

  if (greet) {
    apiMessages.push({
      role: 'user',
      content: `(The user just opened the chat. Send a warm, flirty opening greeting to ${userName}. Be expressive and genuine — at least 4–5 lines.)`,
    });
  } else {
    for (const m of turns) apiMessages.push({ role: m.role, content: m.content });
  }

  const res = await fetch('/.netlify/functions/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: apiMessages, apiKey }),
  });

  const data = await res.json();
  if (!res.ok) throw new Error(data?.reply || 'Server error');
  return data.reply || `Hey ${userName}! 💖`;
}

// ── Send message ─────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });
  showTyping();
  try {
    const reply = await callOpenRouter(chatHistory);
    hideTyping();
    appendMessage('ai', reply);
    chatHistory.push({ role: 'assistant', content: reply });
    if (chatHistory.length > 40) chatHistory = chatHistory.slice(-38);
    aiMsgCount++;
    if (CONFIG.gift.enabled && aiMsgCount === CONFIG.gift.triggerAfterMessage && !giftShown) {
      setTimeout(showGiftPopup, 600);
    }
  } catch (err) {
    hideTyping();
    const msg = err.message?.includes('key') || err.message?.includes('auth')
      ? 'Invalid API key 💔 Please go back and re-enter it.'
      : 'Ami tomar sathe connect korte parcchi na 💔 Try again?';
    appendMessage('ai', msg);
  }
}

// ── Auto-resize textarea ──────────────────────────────────
const msgInput = document.getElementById('msgInput');
msgInput.addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── Greeting ──────────────────────────────────────────────
async function greet() {
  showTyping();
  try {
    const reply = await callOpenRouter([], true);
    hideTyping();
    appendMessage('ai', reply);
    chatHistory.push({ role: 'assistant', content: reply });
  } catch {
    hideTyping();
    appendMessage('ai', `${userName}, Kichu akta error hoise mone hoi 🥺`);
  }
}

greet();
</script>
